# Render's free tier spins the backend down after 15 minutes without traffic,
# and waking it takes ~55s. The first sign-in after a quiet period then waits
# through the whole cold start. Pinging /health every 10 minutes keeps it
# awake (one always-on service fits inside Render's 750 free hours/month) and
# keeps the database connection warm too, since /health probes the DB.
#
# GitHub may delay scheduled runs at busy times and disables them after 60
# days without repository activity — the frontend still tolerates a cold
# start on its own, this only removes the wait.
name: Keep backend warm

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /health
        run: |
          curl --silent --show-error --fail --max-time 120 \
            --retry 2 --retry-delay 10 \
            https://scientia-bx5h.onrender.com/health
